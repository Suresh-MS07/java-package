<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Apex - Invoice Generator</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Background -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
    
    <!-- User Info and Logout Button -->
    <div id="userInfo" class="container text-end mt-3" style="display: none; position: relative; z-index: 2;">
        <span class="text-light">Welcome, <strong id="usernameDisplay"></strong>!</span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light ms-2">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="col-12 col-lg-10 col-xl-8">
            <div class="card glass-effect">
                <div class="card-body p-4 p-md-5">
                    
                    <!-- Watermark -->
                    <div id="watermark">
                        <img src="logo.png" alt="Company Logo">
                        <p>Master Apex Web & Ad Services</p>
                    </div>
                    
                    <div class="invoice-form">
                        <h1 class="text-center mb-4">Invoice Generator</h1>
                        
                        <!-- Company and Client Details -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="companyName" class="form-label">Aapki Company ka Naam</label>
                                <input type="text" id="companyName" class="form-control" placeholder="Master Apex Web and Ad Services">
                            </div>
                            <div class="col-md-6">
                                <label for="clientName" class="form-label">Client ka Naam</label>
                                <input type="text" id="clientName" class="form-control" placeholder="e.g., John Doe">
                            </div>
                        </div>

                        <!-- Items Table -->
                        <h5 class="mt-4">Items</h5>
                        <div class="table-responsive">
                            <table id="itemsTable" class="table table-bordered align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 50%;">Item Description</th>
                                        <th>Quantity</th>
                                        <th>Rate</th>
                                        <th class="text-end">Amount</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Items yahan JavaScript se add honge -->
                                </tbody>
                            </table>
                        </div>
                        <button id="addItemBtn" class="btn btn-secondary mt-2">+ Add Item</button>

                        <!-- Total Section -->
                        <div class="row justify-content-end mt-4">
                            <div class="col-md-5">
                                <table class="table table-sm">
                                    <tbody>
                                        <tr>
                                            <td><strong>Subtotal:</strong></td>
                                            <td class="text-end" id="subtotal">0.00</td>
                                        </tr>
                                        <tr>
                                            <td><strong>Tax (18%):</strong></td>
                                            <td class="text-end" id="tax">0.00</td>
                                        </tr>
                                        <tr class="fw-bold">
                                            <td><strong>Grand Total:</strong></td>
                                            <td class="text-end" id="grandTotal">0.00</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <button id="generateBtn" class="btn btn-primary w-100 mt-3 p-2">Generate Invoice PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
